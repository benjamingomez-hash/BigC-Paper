name: LegendaryWeapons - Windows Defender verification

on:
  push:
    branches: [feat/legendary-six-weapons]
    paths:
      - .github/workflows/legendary-defender.yml
      - standalone/src/**
      - standalone/gradle/**
      - standalone/gradlew*
      - standalone/*.gradle
      - standalone/pack/**
      - standalone/tools/Test-LegendaryDefender.ps1
      - standalone/DOWNLOAD-README.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legendary-defender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test the independent plugin
        working-directory: standalone
        shell: cmd
        run: gradlew.bat --no-daemon --max-workers=2 clean build

      - name: Scan rebuilt distribution and JAR
        id: defender
        shell: powershell
        run: |
          $jars = @(Get-ChildItem standalone/build/libs/LegendaryWeapons-*.jar)
          if ($jars.Count -ne 1) { throw 'Expected exactly one production plugin JAR.' }
          & ./standalone/tools/Test-LegendaryDefender.ps1 `
            -JarPath $jars[0].FullName `
            -DistributionZip standalone/build/distributions/Armas-Legendarias-2.0.12.zip `
            -OutputDirectory "$env:RUNNER_TEMP/legendary-defender-report"

      - name: Preserve scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legendary-defender-report-${{ github.sha }}
          path: ${{ runner.temp }}/legendary-defender-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JAR only after a completed clean Defender scan
        if: success() && steps.defender.outputs.clean_jar == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LegendaryWeapons-defender-checked-${{ github.sha }}
          path: |
            standalone/build/libs/LegendaryWeapons-*.jar
            standalone/build/distributions/Armas-Legendarias-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legendary-test-reports-${{ github.sha }}
          path: standalone/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
