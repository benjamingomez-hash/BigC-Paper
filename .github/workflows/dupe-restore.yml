name: DupeRestore - Build and Windows Defender

on:
  push:
    branches: [main, feat/dupe-restore-plugin]
    paths:
      - .github/workflows/dupe-restore.yml
      - dupe-restore/src/**
      - dupe-restore/gradle/**
      - dupe-restore/gradlew*
      - dupe-restore/*.gradle
      - dupe-restore/.gitattributes
      - dupe-restore/LEEME.txt
      - dupe-restore/tools/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dupe-restore.yml
      - dupe-restore/src/**
      - dupe-restore/gradle/**
      - dupe-restore/gradlew*
      - dupe-restore/*.gradle
      - dupe-restore/.gitattributes
      - dupe-restore/LEEME.txt
      - dupe-restore/tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dupe-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test DupeRestore
        working-directory: dupe-restore
        shell: cmd
        run: gradlew.bat --no-daemon --max-workers=2 clean build

      - name: Test Defender updater failure handling
        shell: powershell
        run: ./dupe-restore/tools/Test-Defender.Tests.ps1

      - name: Scan production JAR and distribution
        id: defender
        shell: powershell
        run: |
          & ./dupe-restore/tools/Test-Defender.ps1 `
            -JarPath dupe-restore/build/libs/DupeRestore-1.0.0.jar `
            -DistributionZip dupe-restore/build/distributions/DupeRestore-1.0.0.zip `
            -OutputDirectory "$env:RUNNER_TEMP/duperestore-defender-report"

      - name: Preserve scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duperestore-defender-report-${{ github.sha }}
          path: ${{ runner.temp }}/duperestore-defender-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve checked plugin and ZIP
        if: success() && steps.defender.outputs.clean_jar == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DupeRestore-checked-${{ github.sha }}
          path: |
            dupe-restore/build/libs/DupeRestore-1.0.0.jar
            dupe-restore/build/distributions/DupeRestore-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duperestore-test-reports-${{ github.sha }}
          path: dupe-restore/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
