legendary-weapons:
  friendly-fire: false
  max-active-effects: 32
  max-targets-per-pulse: 12
  particles-per-ring: 24
  # Bloodlust: Fuerza III durante 200 ticks y medio corazón por golpe directo válido.
  # Shadow usa daño mágico (2 puntos = 1 corazón).
  # Earthbreaker talla terreno y quita 4 puntos de salud una vez.
  shadow-blade:
    range: 16
    # Máximo 6 incluso con valores antiguos más altos; sustituye strike-damage.
    ambush-damage: 6
  windweaver:
    upward-velocity: 1.3
  spear:
    flight-speed: 1.8
    max-flight-ticks: 80
    storm-radius: 7
    # El campo paraliza también al lanzador; solo un impacto directo recibe daño.
    max-paralyzed-targets: 64
    lightning-damage: 7
    # on-respawn o on-join; nunca se arroja al suelo.
    death-return: on-respawn

resource-pack:
  enabled: true
  bind-address: 127.0.0.1
  port: 8124
  url: http://127.0.0.1:8124/legendary-pack.zip
