legendary-weapons:
  friendly-fire: false
  model-animations:
    enabled: true
    # false mantiene ataques/poderes animados, con reposo estático.
    idle: true
  max-active-effects: 32
  max-targets-per-pulse: 12
  particles-per-ring: 24
  # Compatibilidad con devoluciones pendientes de versiones anteriores.
  spear:
    death-return: on-respawn
  # HP base: 2 HP = 1 corazón; armadura y encantamientos reducen estos valores.
  # Duraciones y cooldowns en segundos; alcance y radio en bloques.
  abilities:
    lightning-dash: {damage: 4, range: 8, radius: 0, duration: 1, cooldown: 20}
    thunder-mark: {damage: 5, secondary-damage: 3, range: 0, radius: 4, duration: 6, cooldown: 40}
    chain-lightning: {damage: 6, range: 15, radius: 5, duration: 1, cooldown: 35}
    thunderstorm: {damage: 4, range: 20, radius: 6, duration: 8, cooldown: 60}
    wrath-of-zeus: {damage: 12, secondary-damage: 5, range: 20, radius: 5, duration: 1.5, cooldown: 90}
    wind-dash: {damage: 0, range: 9, radius: 0, duration: 1, cooldown: 18}
    skybreaker: {damage: 8, outer-damage: 4, range: 8, radius: 5, duration: 10, cooldown: 40}
    tornado: {damage: 2, max-damage: 6, speed: 3, range: 15, radius: 3, duration: 5, cooldown: 40}
    wind-prison: {damage: 0, range: 12, radius: 5, duration: 5, cooldown: 50}
    heavens-fall: {damage: 12, outer-damage: 6, range: 12, radius: 7, duration: 12, cooldown: 90}

resource-pack:
  enabled: true
  bind-address: 127.0.0.1
  port: 8124
  url: http://127.0.0.1:8124/legendary-pack.zip
