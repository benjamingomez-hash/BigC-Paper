legendary-weapons:
  friendly-fire: false
  max-active-effects: 32
  max-targets-per-pulse: 12
  particles-per-ring: 24
  # Bloodlust siempre aplica Fuerza III durante 200 ticks (10 segundos).
  # Shadow usa daño mágico (2 puntos = 1 corazón). Frost aplica estados,
  # Hyperion lanza Fireball vanilla. Earthbreaker talla terreno y aplica
  # un único golpe fijo de 4 puntos de salud (dos corazones).
  frost-scythe:
    max-targets: 64
  shadow-blade:
    range: 16
    # Sustituye la clave strike-damage anterior; funciona también al actualizar.
    ambush-damage: 14
  hyperion:
    explosion-power: 2
    ignite-blocks: false
  windweaver:
    upward-velocity: 1.3
  void-katana:
    damage-per-cut: 5
  spear:
    flight-speed: 1.8
    max-flight-ticks: 80
    storm-radius: 7
    # El campo paraliza también al lanzador; solo un impacto directo recibe daño.
    max-paralyzed-targets: 64
    lightning-damage: 7
    # on-respawn o on-join; nunca se arroja al suelo.
    death-return: on-respawn

resource-pack:
  enabled: true
  bind-address: 127.0.0.1
  port: 8124
  url: http://127.0.0.1:8124/legendary-pack.zip
