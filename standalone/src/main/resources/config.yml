legendary-weapons:
  friendly-fire: false
  max-active-effects: 32
  max-targets-per-pulse: 12
  particles-per-ring: 24
  # Bloodlust siempre aplica Fuerza III durante 200 ticks (10 segundos).
  # Los daños mágicos se expresan en puntos (2 = 1 corazón); Protección y
  # Resistencia siguen reduciéndolos. Katana y spear conservan su daño anterior.
  frost-scythe:
    damage-per-pulse: 4
  shadow-blade:
    range: 16
    strike-damage: 10
  hyperion:
    impact-damage: 12
    field-damage: 4
  windweaver:
    upward-velocity: 1.3
  earthbreaker:
    damage-per-wave: 8
  void-katana:
    damage-per-cut: 5
  spear:
    flight-speed: 1.8
    max-flight-ticks: 80
    storm-radius: 7
    lightning-damage: 7
    # on-respawn o on-join; nunca se arroja al suelo.
    death-return: on-respawn

resource-pack:
  enabled: true
  bind-address: 127.0.0.1
  port: 8124
  url: http://127.0.0.1:8124/legendary-pack.zip
