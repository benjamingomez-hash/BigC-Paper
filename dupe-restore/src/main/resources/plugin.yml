name: DupeRestore
version: '${version}'
main: dev.linqfy.bigCasares.duperestore.DupeRestorePlugin
api-version: '26.2'
load: POSTWORLD
authors: [linqfy]
description: Granjas de hilo con origen waterlogged y consulta de opciones nativas de Paper.
commands:
  duperestore:
    description: Estado y configuración de los dupes
    usage: /duperestore [status|reload]
    permission: duperestore.admin
permissions:
  duperestore.admin:
    default: op
